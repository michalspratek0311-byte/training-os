<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Training OS — Week Split 2026/7</title>
  <link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Horní lišta -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="app-brand">TRAINING <span>OS</span></div>
        <div id="topbar-subtitle" class="topbar-sub">Week Split Winter 2026/7</div>
      </div>
      <div class="topbar-right">
        <button id="btn-quick-gym" class="pill-btn gym-pill" type="button" title="Přepnout posilovnu">
          <span class="dot-gym"></span>
          <span id="quick-gym-label">Fitko</span>
        </button>
        <button id="btn-quick-sync" class="icon-btn sync-btn" type="button" title="Synchronizovat">
          <span id="sync-dot" class="sync-dot"></span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
            <path d="M16 16h5v5"/>
          </svg>
          <span id="outbox-badge" class="badge-count hidden">0</span>
        </button>
      </div>
    </header>

    <!-- Hlavní obsah záložek -->
    <main class="main-content">
      <section id="tab-workout" class="tab-view active"></section>
      <section id="tab-big3" class="tab-view"></section>
      <section id="tab-analytics" class="tab-view"></section>
      <section id="tab-catalog" class="tab-view"></section>
      <section id="tab-settings" class="tab-view"></section>
    </main>

    <!-- Plovoucí lišta pauzovače -->
    <div id="floating-timer" class="floating-timer hidden">
      <div class="ft-info">
        <span class="ft-label" id="ft-label">PAUZA</span>
        <span class="ft-time" id="ft-time">02:00</span>
      </div>
      <div class="ft-actions">
        <button type="button" class="ft-btn" data-timer-delta="-15">-15s</button>
        <button type="button" class="ft-btn" data-timer-delta="30">+30s</button>
        <button type="button" class="ft-btn ft-stop" id="ft-stop">Stop</button>
      </div>
    </div>

    <!-- Spodní navigace (5 záložek) -->
    <nav class="bottom-nav" aria-label="Hlavní navigace">
      <button class="nav-item active" data-tab="workout" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 6.5h11"/><path d="M6.5 17.5h11"/><path d="M4 9v6"/><path d="M20 9v6"/><path d="M2 10.5v3"/><path d="M22 10.5v3"/><path d="M12 6.5v11"/>
        </svg>
        <span>Dnes</span>
      </button>
      <button class="nav-item" data-tab="big3" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/>
        </svg>
        <span>Big 3</span>
      </button>
      <button class="nav-item" data-tab="analytics" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 17 9 11 13 15 21 7"/><polyline points="14 7 21 7 21 14"/>
        </svg>
        <span>Progres</span>
      </button>
      <button class="nav-item" data-tab="catalog" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/>
        </svg>
        <span>Katalog</span>
      </button>
      <button class="nav-item" data-tab="settings" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09c-.66 0-1.25.4-1.51 1z"/>
        </svg>
        <span>Sync</span>
      </button>
    </nav>
  </div>

  <!-- Univerzální modální okno (Bottom Sheet na mobilu) -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title">Detail</h3>
        <button id="modal-close" class="modal-close" type="button" aria-label="Zavřít">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Toast notifikace -->
  <div id="toast" class="toast hidden"></div>

  <!-- Klasické skripty (fungují lokálně přes file:// i přes GitHub Pages) -->
  <script src="js/store.js"></script>
  <script src="js/workout.js"></script>
  <script src="js/big3.js"></script>
  <script src="js/analytics.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function (err) {
        console.warn('SW registrace selhala:', err);
      });
    });
  }
</script>
</body>
</html>
